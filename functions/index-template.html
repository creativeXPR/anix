<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Applied before first paint so a saved "dark" preference doesn't
      // flash light first — kept in sync with ThemeProvider's own logic.
      // Light is the default since the NGL redesign (2026-10-12); the key
      // moved to anix:theme-v2 because the old key held "dark" for every
      // existing user (it was written on every visit), not a real choice.
      try {
        if (localStorage.getItem('anix:theme-v2') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      } catch {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f8f5fd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#120a16" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
